# Build the Lockpad backend + frontend images and publish them to the GitHub
# Container Registry (GHCR) so end users can PULL prebuilt images instead of
# building from source. Multi-arch (amd64 + arm64) so it runs on NAS boxes,
# Raspberry Pis, Apple Silicon, and normal x86 servers alike.
#
# Images published:
#   ghcr.io/<owner>/lockpad-backend
#   ghcr.io/<owner>/lockpad-frontend
#
# No secrets are needed — the automatically-provided GITHUB_TOKEN authenticates
# to GHCR. After the first successful run, make the two packages public in the
# repo's Packages settings so anonymous `docker pull` works.
#
# ── This file is published, and that is load-bearing, not incidental ─────────
#
# THIS FILE SHIPS TO Lockpad-Public via PUBLIC_PATHS. That is deliberate, and it
# is the whole reason the job below carries a repository guard. Two repos, two
# very different Actions-minutes situations:
#
#   - Lockpad-Private is on GitHub's metered free tier (2,000 min/month). It
#     used to run this workflow on every push to main — every dev commit, not
#     just releases — and six wedged runs in August 2026 alone burned 721
#     job-minutes each before timing out, consuming 95% of a month's quota on
#     builds nobody needed yet.
#   - Lockpad-Public is a public repository, so its Actions minutes on
#     GitHub-hosted runners are unmetered. The only thing that ever pushes to
#     its `main` is `scripts/publish-public.sh --push`, which is a deliberate,
#     human-confirmed act at release time — not a continuous stream of commits.
#
# So the build moved: `jobs.publish.if` below means this workflow now only ever
# ACTUALLY RUNS in Lockpad-Public, triggered by the vX.Y.Z tag that gated publish
# push carries. In Lockpad-Private the tag trigger still fires but the job shows
# as skipped and burns zero runner minutes — GitHub does not bill for a job whose
# `if:` evaluates false. Same file in both trees; the behaviour difference is
# which repository is asking.
#
# One consequence worth stating plainly: `release.sh` + `git push origin main
# --follow-tags` no longer builds anything by itself. The images now come from
# the SAME push that makes the release public — see docs/RELEASING.md, which
# this comment should stay in sync with.
name: Publish images

# ── Tags only. There is deliberately no branch trigger ───────────────────────
#
# A `push: branches: [main]` trigger was here, and it built the release source a
# SECOND time. That was not an accident of configuration: publish-public.sh pushes
# one squashed commit as both `main` and the vX.Y.Z tag, so the two runs compiled
# identical code and differed only in what they tagged. The branch run's only
# product that the tag run does not also produce is `sha-<short>` — and the only
# thing that consumed it was a CI badge on the public README.
#
# Judged and dropped: a duplicate multi-arch build on every release, doubling the
# time before images exist and the number of runs that can fail, is a real cost,
# and a green badge is not worth paying it. The badge came off the README in the
# same commit rather than being left to rot at "no status".
#
# Consequence to keep in mind: nothing here validates a commit before a release
# is cut. The build now runs for the first time at tag time, so a broken build is
# discovered during a release rather than before one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time per ref, so a re-cut or re-pushed tag supersedes a build that
# is already pointless rather than racing it — an obsolete build still occupies a
# runner for every minute it takes. Keyed on the ref, so two different releases
# tagged close together do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only Lockpad-Public ever actually builds. See the file header — this is
    # the fix for the private repo's metered-quota incident, not a permissions
    # check, so it compares the repository name rather than gating on an actor
    # or a secret.
    if: github.repository == 'Colbysdovi/Lockpad-Public'
    # A healthy run finishes in 5-9 minutes, so 30 is generous. It is here because
    # of what happens without it: six runs in August 2026 published their images
    # normally and then wedged, idling until GitHub's own six-hour cap killed them.
    # Those six cost ~721 job-minutes each and burned 95% of the month's quota,
    # while the other eighteen runs together cost 243. The failure is invisible
    # while it happens - the images are already pushed, so nothing looks broken.
    # This turns a 721-minute silent wedge into a 60-minute loud failure.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            # Each image bakes the release string under its own build-arg name:
            # the backend reads a plain env var, the frontend needs the VITE_
            # prefix for Vite to expose it to the bundle.
            versionArg: APP_VERSION
          - name: frontend
            context: ./frontend
            versionArg: VITE_APP_VERSION
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One version string for the whole release, baked into BOTH images so the
      # app can tell the user what it is running (Settings → About). A tag build
      # is a real release and gets the tag verbatim; anything else is explicitly
      # not a release and says so, because a build that claims a version number it
      # doesn't have makes every bug report ambiguous.
      - name: Derive the app version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image name (lowercased owner)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lockpad-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # ── Which run publishes `latest`, and why it is the TAG run ──────────────
      #
      # `latest` used to come from the default branch — `enable={{is_default_branch}}`
      # — and on the private repo that was right: main moved on every dev commit, so
      # "latest" honestly meant "the tip of main".
      #
      # It is wrong here. The public repo receives exactly one squashed commit per
      # release, and publish-public.sh pushes that same commit as BOTH `main` and the
      # `vX.Y.Z` tag. So the two runs compile identical source and differ only in what
      # the ref makes this step emit — and the branch run stamps the app `main-<sha>`,
      # which IS_RELEASE in frontend/src/lib/version.ts correctly refuses to treat as a
      # release. Leaving `latest` on the branch run therefore published the release
      # source under a build that calls itself "Development build" in Settings → About.
      #
      # So `latest` is published by the tag build, where the version stamp is the real
      # one. One run per release now produces everything: vX.Y.Z, latest and
      # sha-<short>. The `enable=` guard stays rather than being simplified to a bare
      # `type=raw,value=latest`, because workflow_dispatch can still be aimed at a
      # branch, and a manual run off a branch must not move `latest`.
      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Frontend bakes the API base at build time; /api is same-origin via
          # nginx, so this default is correct for every deployment.
          build-args: |
            VITE_API_BASE_URL=/api
            ${{ matrix.versionArg }}=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
