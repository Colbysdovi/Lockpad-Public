# Lockpad for Runtipi.
#
# Submit to https://github.com/runtipi/runtipi-appstore (apps/lockpad/), or add
# this repo's packaging/runtipi as a custom app store. Runtipi auto-generates
# the `random` form fields (SESSION_SECRET, POSTGRES_PASSWORD) and injects them
# here — the user only optionally sets APP_PASSWORD.
#
# Runtipi requires the main service to be named after the app id (`lockpad`) and
# to listen on ${APP_PORT}. The frontend's nginx proxies /api to the host named
# `backend`, so the backend service carries that network alias.

version: "3.7"

services:
  lockpad:
    image: ghcr.io/colbysdovi/lockpad-frontend:v1.0.0
    container_name: lockpad
    restart: unless-stopped
    depends_on:
      - lockpad-backend
    ports:
      - "${APP_PORT}:80"
    networks:
      - tipi_main_network

  lockpad-backend:
    image: ghcr.io/colbysdovi/lockpad-backend:v1.0.0
    container_name: lockpad-backend
    restart: unless-stopped
    depends_on:
      lockpad-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lockpad:${POSTGRES_PASSWORD}@lockpad-db:5432/lockpad?schema=public
      BACKEND_PORT: 4000
      LOG_DIR: /var/log/lockpad
      CORS_ORIGINS: http://localhost:${APP_PORT}
      NODE_ENV: production
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data/logs:/var/log/lockpad
    networks:
      tipi_main_network:
        aliases:
          - backend

  lockpad-db:
    image: postgres:16-alpine
    container_name: lockpad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lockpad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lockpad
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockpad -d lockpad"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tipi_main_network

networks:
  tipi_main_network:
    external: true
