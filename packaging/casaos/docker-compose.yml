# Lockpad for CasaOS.
#
# Install now without a PR:  CasaOS → App Store → Custom Install → Import, then
# paste this file (or its raw URL). Edit APP_PASSWORD and SESSION_SECRET in the
# form before clicking Install.
#
# The frontend's nginx proxies /api to the service literally named `backend`, so
# that name / alias must not change. Postgres has no host port — internal only.
name: lockpad

services:
  postgres:
    image: postgres:16-alpine
    container_name: lockpad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lockpad
      # Internal-only DB (no ports). Still, change this to a random value.
      POSTGRES_PASSWORD: change-me-postgres
      POSTGRES_DB: lockpad
    volumes:
      - /DATA/AppData/lockpad/pgdata:/var/lib/postgresql/data
    networks:
      - lockpad_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockpad -d lockpad"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/colbysdovi/lockpad-backend:v1.0.0
    container_name: lockpad-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lockpad:change-me-postgres@postgres:5432/lockpad?schema=public
      BACKEND_PORT: 4000
      LOG_DIR: /var/log/lockpad
      # Same-origin behind the frontend proxy; the tailnet/LAN URL also works.
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: production
      # The single login password for the app (may be blank to disable auth).
      APP_PASSWORD: change-me-login
      # Signs the login cookie — set a long random string, unique to this install.
      SESSION_SECRET: change-me-session-secret
      COOKIE_SECURE: "false"
    volumes:
      - /DATA/AppData/lockpad/logs:/var/log/lockpad
    networks:
      lockpad_internal:
        aliases:
          - backend

  frontend:
    image: ghcr.io/colbysdovi/lockpad-frontend:v1.0.0
    container_name: lockpad-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - lockpad_internal

networks:
  lockpad_internal:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: frontend
  author: Colbysdovi
  developer: Colbysdovi
  category: Notes
  icon: https://raw.githubusercontent.com/Colbysdovi/Lockpad-Public/main/frontend/public/icon-512.png
  screenshot_link: []
  title:
    en_us: Lockpad
  tagline:
    en_us: Self-hosted, privacy-first notes
  description:
    en_us: >-
      Lockpad is a self-hosted, privacy-first note-taking app: tags, folders,
      note-to-note links, rich text, full-text search, and per-note end-to-end
      encryption. It runs entirely on your own hardware and makes zero outbound
      network requests — no analytics, no telemetry, no external CDNs.
  port_map: "5173"
  scheme: http
  index: /
  envs:
    - container: APP_PASSWORD
      description:
        en_us: Login password for the app (leave blank to disable the login screen).
    - container: SESSION_SECRET
      description:
        en_us: Long random string that signs the login cookie. Use a unique value.
    - container: POSTGRES_PASSWORD
      description:
        en_us: Internal database password. Any long random string; not exposed to the network. If you change it, set the same value inside DATABASE_URL too.
    - container: DATABASE_URL
      description:
        en_us: Leave as-is unless you changed POSTGRES_PASSWORD, then use the same password here.
