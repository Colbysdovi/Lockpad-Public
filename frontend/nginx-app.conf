# Everything the app needs, independent of which port or protocol carried the
# request. Included by BOTH the plain-HTTP server (port 80, what the Tailscale
# sidecar proxies to over the internal Docker network) and the TLS server
# (port 443, the direct-on-your-LAN option). Kept in one file on purpose: two
# copies of a CSP drift, and the copy that drifts is the one that stops
# protecting you.

root /usr/share/nginx/html;
index index.html;

# SPA history fallback: unknown routes serve index.html so client routing works.
location / {
    try_files $uri $uri/ /index.html;
}

# Proxy API to the backend container over the internal Docker network.
location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend's rate limiter counts per client. Without this every request
    # arrives wearing this container's address and one busy tab would spend the
    # whole allowance for every device in the house.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# No external resources are referenced; this CSP blocks any accidental
# outbound fetch/script/font/image, enforcing the privacy guarantee.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
