# Direct HTTPS on your own network, with no Tailscale in the path.
#
# This file is NOT active by default — it is mounted into conf.d only by the
# docker-compose.lan-tls.yml overlay, because nginx refuses to start when
# ssl_certificate points at a file that isn't there. Keeping it out of the image's
# default config means the ordinary deployment cannot be broken by a missing cert.
#
# Why bother with TLS on a LAN at all, when plain HTTP would be less work: browsers
# only expose window.crypto.subtle in a "secure context" (HTTPS, or localhost).
# Lockpad's per-note locking is built on it, so over plain http://<nas-ip>:5173 the
# lock button correctly refuses to run. Encrypting the LAN hop is worth doing on its
# own merits, but this is the reason it is not optional.
#
# The certificate is one you issue yourself (see DEPLOY.md §9) and trust on your own
# devices. No public CA is involved and nothing about your network leaves the house.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/lockpad.pem;
    ssl_certificate_key /etc/nginx/certs/lockpad-key.pem;

    # TLS 1.2+ only. There is no legacy client to accommodate here — the devices
    # reaching this are your own, and all of them are current.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;

    # Deliberately NO Strict-Transport-Security. HSTS would pin this host to HTTPS
    # in every browser that saw it, which would sabotage the plain-HTTP recovery
    # path in DEPLOY.md §8 on the very same address — the one you would be reaching
    # for precisely when things are already broken.

    # Typing http:// against a TLS port is the single most likely way to arrive
    # here, because browsers autocomplete the scheme from history and habit. nginx's
    # default answer is a bare 400 with no hint that the scheme is the problem —
    # indistinguishable, from the driver's seat, from the server being broken. Send
    # people to the right place instead. $http_host rather than $host: it carries the
    # port the client actually typed (5174), where $server_port would report 443 from
    # inside the container and redirect into a closed door.
    error_page 497 =301 https://$http_host$request_uri;

    include /etc/nginx/snippets/lockpad-app.conf;
}
